  const cut=drw(await bmp(q.b),w,h,0);BE={orig,cut,w,h,hist:[]};TR={s:{x:0,y:0,k:1},b:{x:0,y:0,k:1}};updZ();setSt(q.q?t('qk'):'');drawB()}
 catch(e){setSt(t('fail')+' '+String(e.message||e).slice(0,60))}}
$('rr').onclick=()=>{if(mode==='b'&&items[cur])loadB(items[cur])};
function paintB(x,w,h,solid){
 if(bg==='img'&&bgI){const[bw,bh]=dim(bgI),o=TR.b,k=Math.max(w/bw,h/bh)*o.k,dw=bw*k,dh=bh*k;x.drawImage(bgI,(w-dw)/2+o.x,(h-dh)/2+o.y,dw,dh)}
 else{const fl=bg!=='transparent'?bg:solid;if(fl){x.fillStyle=fl;x.fillRect(0,0,w,h)}}
 const s=TR.s,cw=BE.cut.width*s.k,ch=BE.cut.height*s.k;x.drawImage(BE.cut,(w-cw)/2+s.x,(h-ch)/2+s.y,cw,ch)}
let curp=null;
function drawB(){if(!BE)return;if(cv.width!==BE.w||cv.height!==BE.h){cv.width=BE.w;cv.height=BE.h}
 const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);paintB(x,cv.width,cv.height,0);
 if(curp&&tool!=='m'){x.strokeStyle='#fff';x.lineWidth=Math.max(2,cv.width/300);x.beginPath();x.arc(curp.x,curp.y,sizes[tool]*cv.width/700,0,6.2832);x.stroke()}}
async function exportB(){
 if(!BE)return;try{const f=$('fmt').value,c=document.createElement('canvas');c.width=BE.w;c.height=BE.h;paintB(c.getContext('2d'),c.width,c.height,fill(f));
  showDl({blob:await out(c,f,.95),w:c.width,h:c.height},f,'nobg')}catch(e){setSt(t('fail')+' '+String(e.message||e).slice(0,60))}}
$('sv').onclick=()=>mode==='e'?exportE():exportB();
const updZ=()=>{const k=Math.round(TR[mt].k*100);$('zs').value=k;$('zv').textContent=k};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));$('bs').value=sizes[tool]||40;$('bsv').textContent=$('bs').value;$('bs').disabled=tool==='m'});
document.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{mt=b.dataset.mt;document.querySelectorAll('[data-mt]').forEach(x=>x.classList.toggle('on',x===b));updZ()});
$('bs').oninput=e=>{$('bsv').textContent=e.target.value;if(tool!=='m')sizes[tool]=+e.target.value};
$('bs').disabled=true;
$('zs').oninput=e=>{TR[mt].k=e.target.value/100;$('zv').textContent=e.target.value;drawB()};
$('un').onclick=()=>{if(BE&&BE.hist.length){BE.cut=BE.hist.pop();drawB()}};
function push(){const c=document.createElement('canvas');c.width=BE.cut.width;c.height=BE.cut.height;c.getContext('2d').drawImage(BE.cut,0,0);BE.hist.push(c);if(BE.hist.length>8)BE.hist.shift()}
function stroke(a,b){
 const k=TR.s.k,ox=(cv.width-BE.cut.width*k)/2+TR.s.x,oy=(cv.height-BE.cut.height*k)/2+TR.s.y,r=sizes[tool]*cv.width/700/k,c=BE.cut.getContext('2d'),
  A={x:(a.x-ox)/k,y:(a.y-oy)/k},B={x:(b.x-ox)/k,y:(b.y-oy)/k},n=Math.max(1,Math.ceil(Math.hypot(B.x-A.x,B.y-A.y)/(r/3)));
 for(let i=0;i<=n;i++){const x=A.x+(B.x-A.x)*i/n,y=A.y+(B.y-A.y)*i/n;c.save();c.beginPath();c.arc(x,y,r,0,6.2832);
  if(tool==='e'){c.globalCompositeOperation='destination-out';c.fill()}else{c.clip();c.drawImage(BE.orig,0,0)}c.restore()}}
let ptr=null;
const cpos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
cv.onpointerdown=e=>{if(mode!=='b'||!BE)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}ptr=cpos(e);if(tool!=='m'){push();stroke(ptr,ptr)}curp=ptr;drawB()};
cv.onpointermove=e=>{if(!ptr||!BE)return;e.preventDefault();const p=cpos(e);if(tool==='m'){const o=TR[mt];o.x+=p.x-ptr.x;o.y+=p.y-ptr.y}else stroke(ptr,p);ptr=p;curp=p;drawB()};
const up=()=>{ptr=null;curp=null;drawB()};cv.onpointerup=up;cv.onpointercancel=up;

applyLang();
